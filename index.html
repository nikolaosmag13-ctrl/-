<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ημερολόγιο Βαρδιών</title>

  <!-- Σύνδεση με το αρχείο manifest και ορισμός χρώματος θέματος -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">

  <!-- Εικονίδιο για συσκευές Apple (iOS Safari) -->
  <link rel="apple-touch-icon" href="iconvardia.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 460px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 4px 0;
    }

    header h2 {
      font-size: 1.25rem;
    }

    .nav-btn {
      background-color: #334155;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-weight: bold;
      font-size: 0.8rem;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    .day-cell {
      background-color: #1e293b;
      min-height: 65px;
      border-radius: 6px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      font-size: 0.75rem;
      cursor: pointer;
      border: 1px solid #334155;
    }

    .day-cell.empty {
      background-color: transparent;
      border: none;
      cursor: default;
    }

    .day-cell.today {
      border: 2px solid #38bdf8;
    }

    .day-number {
      font-weight: bold;
    }

    .shift-tag {
      font-size: 0.65rem;
      padding: 2px 2px;
      border-radius: 4px;
      margin-top: 2px;
      text-align: center;
      font-weight: bold;
    }

    .shift-night { background-color: #4338ca; color: #e0e7ff; }
    .shift-afternoon { background-color: #c2410c; color: #ffedd5; }
    .shift-morning { background-color: #15803d; color: #dcfce7; }
    .shift-off { background-color: #334155; color: #94a3b8; }

    .ot-tag {
      background-color: #dc2626;
      color: white;
      font-size: 0.6rem;
      padding: 1px 3px;
      border-radius: 3px;
      margin-top: 2px;
      text-align: center;
    }

    .note-indicator {
      font-size: 0.65rem;
      color: #facc15;
      text-align: center;
    }

    .general-notes {
      margin-top: 20px;
      background-color: #1e293b;
      padding: 12px;
      border-radius: 8px;
    }

    .general-notes h3 {
      font-size: 1rem;
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      height: 70px;
      background-color: #0f172a;
      border: 1px solid #475569;
      color: white;
      padding: 8px;
      border-radius: 6px;
      resize: none;
      font-size: 0.85rem;
    }

    .save-btn {
      margin-top: 6px;
      width: 100%;
      padding: 10px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      padding: 16px;
      z-index: 10;
    }

    .modal {
      background-color: #1e293b;
      padding: 16px;
      border-radius: 10px;
      width: 100%;
      max-width: 360px;
    }

    .modal h3 {
      margin-bottom: 12px;
    }

    .modal label {
      display: block;
      font-size: 0.8rem;
      margin-top: 8px;
      margin-bottom: 4px;
      color: #94a3b8;
    }

    .modal input, .modal textarea {
      width: 100%;
      padding: 8px;
      background-color: #0f172a;
      border: 1px solid #475569;
      color: white;
      border-radius: 6px;
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      margin-top: 14px;
    }

    .modal-actions button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-close { background-color: #475569; color: white; }
    .btn-save { background-color: #16a34a; color: white; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <button class="nav-btn" id="prev-month">&lt;</button>
      <h2 id="month-title">Μήνας Έτος</h2>
      <button class="nav-btn" id="next-month">&gt;</button>
    </header>

    <div class="weekdays">
      <div>Δευ</div><div>Τρί</div><div>Τετ</div><div>Πέμ</div><div>Παρ</div><div>Σάβ</div><div>Κυρ</div>
    </div>

    <div class="calendar-grid" id="calendar-grid"></div>

    <div class="general-notes">
      <h3>📌 Γενικές Σημειώσεις</h3>
      <textarea id="general-notes-input" placeholder="Γράψε εδώ γενικές σημειώσεις..."></textarea>
      <button class="save-btn" id="save-general-btn">Αποθήκευση Γενικών Σημειώσεων</button>
    </div>
  </div>

  <!-- Modal Επεξεργασίας Ημέρας -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-date-title">Ημερομηνία</h3>
      <p id="modal-shift-info" style="font-size:0.9rem; margin-bottom: 8px;"></p>

      <label>Υπερωρία (π.χ. 2 ώρες ή 18:00-20:00):</label>
      <input type="text" id="modal-overtime-input" placeholder="π.χ. 2 ώρες">

      <label>Σημείωση Ημέρας:</label>
      <textarea id="modal-note-input" placeholder="Σημείωση για αυτή τη μέρα..."></textarea>

      <div class="modal-actions">
        <button class="btn-close" id="modal-close-btn">Κλείσιμο</button>
        <button class="btn-save" id="modal-save-btn">Αποθήκευση</button>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // ΡΥΘΜΙΣΕΙΣ ΒΑΡΔΙΩΝ & ΗΜΕΡΟΜΗΝΙΑΣ ΒΑΣΗΣ
    // -------------------------------------------------------------
    const SHIFTS = [
      { name: "🌙 Βράδυ", class: "shift-night" },
      { name: "🌆 Απόγευμα", class: "shift-afternoon" },
      { name: "☀️ Πρωί", class: "shift-morning" }
    ];

    // Δευτέρα 05/10/2026: Βράδυ (δείκτης 0)
    const BASE_MONDAY = new Date(2026, 9, 5); 
    const BASE_SHIFT_INDEX = 0;

    let currentDate = new Date();
    let currentMonth = currentDate.getMonth();
    let currentYear = currentDate.getFullYear();
    let selectedDateKey = null;

    let dayData = JSON.parse(localStorage.getItem('shift_calendar_days') || '{}');
    let generalNotes = localStorage.getItem('shift_calendar_general') || '';

    const gridElement = document.getElementById('calendar-grid');
    const monthTitle = document.getElementById('month-title');
    const prevBtn = document.getElementById('prev-month');
    const nextBtn = document.getElementById('next-month');

    const generalNotesInput = document.getElementById('general-notes-input');
    const saveGeneralBtn = document.getElementById('save-general-btn');

    const modalOverlay = document.getElementById('modal-overlay');
    const modalTitle = document.getElementById('modal-date-title');
    const modalShiftInfo = document.getElementById('modal-shift-info');
    const modalOtInput = document.getElementById('modal-overtime-input');
    const modalNoteInput = document.getElementById('modal-note-input');
    const modalCloseBtn = document.getElementById('modal-close-btn');
    const modalSaveBtn = document.getElementById('modal-save-btn');

    generalNotesInput.value = generalNotes;

    // Υπολογισμός βάρδιας
    function getShiftForDate(date) {
      const dayOfWeek = (date.getDay() + 6) % 7; // 0=Δευτέρα ... 6=Κυριακή

      if (dayOfWeek === 5 || dayOfWeek === 6) {
        return { name: "Ρεπό", class: "shift-off" };
      }

      const mondayOfThisWeek = new Date(date.getFullYear(), date.getMonth(), date.getDate());
      mondayOfThisWeek.setDate(mondayOfThisWeek.getDate() - dayOfWeek);

      const diffTime = mondayOfThisWeek.getTime() - BASE_MONDAY.getTime();
      const diffWeeks = Math.floor(diffTime / (7 * 24 * 60 * 60 * 1000));

      let shiftIndex = (BASE_SHIFT_INDEX + (diffWeeks % 3)) % 3;
      if (shiftIndex < 0) shiftIndex += 3;

      return SHIFTS[shiftIndex];
    }

    // Σχεδίαση Ημερολογίου
    const monthNames = [
      "Ιανουάριος", "Φεβρουάριος", "Μάρτιος", "Απρίλιος", "Μάιος", "Ιούνιος",
      "Ιούλιος", "Αύγουστος", "Σεπτέμβριος", "Οκτώβριος", "Νοέμβριος", "Δεκέμβριος"
    ];

    function renderCalendar() {
      monthTitle.innerText = `${monthNames[currentMonth]} ${currentYear}`;
      gridElement.innerHTML = '';

      const firstDayOfMonth = new Date(currentYear, currentMonth, 1);
      const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();
      const startDayIndex = (firstDayOfMonth.getDay() + 6) % 7;

      for (let i = 0; i < startDayIndex; i++) {
        const emptyCell = document.createElement('div');
        emptyCell.classList.add('day-cell', 'empty');
        gridElement.appendChild(emptyCell);
      }

      const today = new Date();

      for (let day = 1; day <= totalDays; day++) {
        const cellDate = new Date(currentYear, currentMonth, day);
        const dateKey = `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        const shift = getShiftForDate(cellDate);
        const data = dayData[dateKey] || {};

        const cell = document.createElement('div');
        cell.classList.add('day-cell');

        if (
          today.getDate() === day &&
          today.getMonth() === currentMonth &&
          today.getFullYear() === currentYear
        ) {
          cell.classList.add('today');
        }

        const numSpan = document.createElement('span');
        numSpan.classList.add('day-number');
        numSpan.innerText = day;
        cell.appendChild(numSpan);

        const shiftDiv = document.createElement('div');
        shiftDiv.classList.add('shift-tag', shift.class);
        shiftDiv.innerText = shift.name;
        cell.appendChild(shiftDiv);

        if (data.overtime) {
          const otDiv = document.createElement('div');
          otDiv.classList.add('ot-tag');
          otDiv.innerText = `+${data.overtime}`;
          cell.appendChild(otDiv);
        }

        if (data.note) {
          const noteSpan = document.createElement('div');
          noteSpan.classList.add('note-indicator');
          noteSpan.innerText = '📝';
          cell.appendChild(noteSpan);
        }

        cell.addEventListener('click', () => openDayModal(dateKey, day, shift));
        gridElement.appendChild(cell);
      }
    }

    function openDayModal(dateKey, dayNumber, shift) {
      selectedDateKey = dateKey;
      modalTitle.innerText = `${dayNumber} ${monthNames[currentMonth]} ${currentYear}`;
      modalShiftInfo.innerHTML = `Πρόγραμμα: <strong>${shift.name}</strong>`;

      const existingData = dayData[dateKey] || {};
      modalOtInput.value = existingData.overtime || '';
      modalNoteInput.value = existingData.note || '';

      modalOverlay.style.display = 'flex';
    }

    modalCloseBtn.addEventListener('click', () => {
      modalOverlay.style.display = 'none';
    });

    modalSaveBtn.addEventListener('click', () => {
      const overtime = modalOtInput.value.trim();
      const note = modalNoteInput.value.trim();

      if (overtime || note) {
        dayData[selectedDateKey] = { overtime, note };
      } else {
        delete dayData[selectedDateKey];
      }

      localStorage.setItem('shift_calendar_days', JSON.stringify(dayData));
      modalOverlay.style.display = 'none';
      renderCalendar();
    });

    saveGeneralBtn.addEventListener('click', () => {
      localStorage.setItem('shift_calendar_general', generalNotesInput.value);
      alert('Οι γενικές σημειώσεις αποθηκεύτηκαν!');
    });

    prevBtn.addEventListener('click', () => {
      currentMonth--;
      if (currentMonth < 0) {
        currentMonth = 11;
        currentYear--;
      }
      renderCalendar();
    });

    nextBtn.addEventListener('click', () => {
      currentMonth++;
      if (currentMonth > 11) {
        currentMonth = 0;
        currentYear++;
      }
      renderCalendar();
    });

    // Καταχώριση Service Worker για App / Offline λειτουργία
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(() => console.log('Service Worker ενεργοποιήθηκε!'))
          .catch((err) => console.log('Σφάλμα Service Worker:', err));
      });
    }

    // Αρχική σχεδίαση
    renderCalendar();
  </script>
</body>
</html>
